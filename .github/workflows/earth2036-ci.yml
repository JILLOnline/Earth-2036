name: Earth 2036 CI

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/earth2036-*.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "engine/**"
      - "lib/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/earth2036-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: earth2036-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Engine invariants
        run: npm test
      - name: Production build
        run: npm run build
      - name: Autonomous engine dry run
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: npm run engine:cycle
      - name: Dispatch Pages after verified main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="${GITHUB_SHA}"
