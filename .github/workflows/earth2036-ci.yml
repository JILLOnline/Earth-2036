name: Earth 2036 CI

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/earth2036-*.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "engine/**"
      - "lib/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/earth2036-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: earth2036-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Engine invariants
        run: npm test
      - name: Production build
        run: npm run build
      - name: Static export build and smoke
        env:
          STATIC_EXPORT: "true"
          EARTH2036_BASE_PATH: "/Earth-2036"
        run: |
          npm run build
          npm run smoke:static

      - name: Determine engine dry-run scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(engine/|lib/|scripts/|config/|data/|test/|package(-lock)?\.json$|next\.config\.mjs$)'; then
            echo "run_engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_engine=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Autonomous engine dry run
        if: steps.scope.outputs.run_engine == 'true'
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: npm run engine:cycle
      - name: Verify bounded worker control surfaces
        if: steps.scope.outputs.run_engine == 'true'
        run: node scripts/check-worker-control-surface.mjs
      - name: Dispatch Pages after verified main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="${GITHUB_SHA}"
