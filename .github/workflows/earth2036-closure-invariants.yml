name: Earth 2036 Closure Invariants

on:
  push:
    branches: [main]
    paths:
      - "data/runtime/workgraph/evidence/**"
      - "data/runtime/workgraph/role-runs/**"
      - "scripts/lib/workgraph-v2.mjs"
      - "scripts/workgraph-sync.mjs"
      - "scripts/audit-closure-invariants.mjs"
      - "scripts/build-closure-semantic-overrides.mjs"
      - "config/closure-engine-v1.json"
      - ".github/workflows/earth2036-closure-invariants.yml"
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earth2036-closure-invariants
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Rebuild packet truth and audit closure invariants
        run: |
          set -euo pipefail
          npm ci
          npm run workgraph:sync
          node scripts/build-closure-semantic-overrides.mjs
          audit_status=0
          node scripts/audit-closure-invariants.mjs || audit_status=$?
          echo "closure_invariant_status=$audit_status"
      - name: Persist semantic override projection
        run: |
          set -euo pipefail
          git config user.name "earth2036-invariants[bot]"
          git config user.email "earth2036-invariants@users.noreply.github.com"
          git add data/runtime/workgraph/worker-view/semantic-overrides.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Earth 2036 closure semantic invariant projection"
          # workgraph:sync refreshes derived runtime files for diagnosis, but this
          # workflow owns only the semantic override projection. Restore every
          # uncommitted generated file before rebasing so the projection commit
          # can be replayed cleanly on the newest main without publishing an
          # alternate runtime authority.
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
