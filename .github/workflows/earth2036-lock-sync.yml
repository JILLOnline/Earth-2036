name: Earth 2036 Lock Sync

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Persist lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "earth2036-engine[bot]"
          git config user.email "earth2036-engine@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync Earth 2036 dependency lock"
          git push origin HEAD:main
