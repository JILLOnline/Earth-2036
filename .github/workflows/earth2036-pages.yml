name: Earth 2036 GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact canonical commit to publish"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: earth2036-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact source SHA
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$REQUESTED_SHA"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build exact canonical projection
        env:
          STATIC_EXPORT: "true"
          EARTH2036_BASE_PATH: "/Earth-2036"
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run smoke:static

      - name: Write deployment provenance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          cat > out/earth2036-deploy.json <<JSON
          {
            "sourceBranch": "main",
            "sourceSha": "${SOURCE_SHA}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "authority": "JILLOnline/Earth-2036@main",
            "host": "github-pages"
          }
          JSON

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
