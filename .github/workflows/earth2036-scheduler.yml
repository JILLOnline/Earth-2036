# GitHub-native v2 runtime lane
name: Earth 2036 Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: earth2036-machine-engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and run runtime invariants
        run: |
          set -euo pipefail
          npm ci
          node --test test/workgraph-v2.test.mjs test/operations-invariants.test.mjs

      - name: Run and persist coherent machine cycle
        id: persist
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: |
          set -euo pipefail
          git config user.name "earth2036-engine[bot]"
          git config user.email "earth2036-engine@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin main
            git reset --hard origin/main
            git clean -fd data

            npm run engine:cycle

            base_head=$(git rev-parse HEAD)
            git fetch --no-tags --depth=1 origin main
            remote_head=$(git rev-parse origin/main)

            if [ "$base_head" != "$remote_head" ]; then
              echo "Canonical branch advanced during machine computation; recomputing from newer truth."
              continue
            fi

            if git diff --quiet -- data; then
              echo "persisted_head=$base_head" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add data
            git commit -m "Earth 2036 machine cycle $(date -u +'%Y-%m-%dT%H:00Z')"
            persisted_head=$(git rev-parse HEAD)

            if git push origin HEAD:main; then
              echo "persisted_head=$persisted_head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Unable to persist a coherent Earth 2036 machine cycle after 3 attempts." >&2
          exit 1

      - name: Verify persisted state and publish exact machine snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PERSISTED_HEAD: ${{ steps.persist.outputs.persisted_head }}
        run: |
          set -euo pipefail
          test -n "$PERSISTED_HEAD"
          git fetch --no-tags --depth=50 origin main
          git merge-base --is-ancestor "$PERSISTED_HEAD" origin/main
          gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="$PERSISTED_HEAD"
          gh workflow run fundamentals-trajectory-bridge-live.yml --repo "${{ github.repository }}" --ref main
          echo "Published machine snapshot request for $PERSISTED_HEAD and dispatched the non-canonical #11 live bridge; newer minion commits may remain on main."
