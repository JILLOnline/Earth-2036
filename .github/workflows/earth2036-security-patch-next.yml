name: Earth 2036 One-Time Next Security Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/earth2036-security-patch-next.yml"

permissions:
  contents: write

concurrency:
  group: earth2036-security-patch-next
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current lock
        run: npm ci

      - name: Patch Next.js to audited fixed release
        run: npm install --save-exact next@16.3.8

      - name: Stage dependency patch
        run: |
          set -euo pipefail
          git config user.name "earth2036-security[bot]"
          git config user.email "earth2036-security@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Next.js to 16.3.8 for critical security advisory"

      - name: Verify security and application
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Push verified dependency patch
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
