name: Earth 2036 Scheduler Watchdog

on:
  schedule:
    - cron: "22,42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/earth2036-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: earth2036-scheduler-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read machine and Workgraph freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contents/data/runtime/system-state.json?ref=main" > /tmp/state.json
          gh api "repos/${{ github.repository }}/contents/data/runtime/workgraph/metrics.json?ref=main" > /tmp/metrics.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, datetime as dt, json
          def decode(path):
              p=json.load(open(path))
              return json.loads(base64.b64decode(p['content']).decode())
          state=decode('/tmp/state.json')
          metrics=decode('/tmp/metrics.json')
          stamp=state.get('lastCycleAt')
          if not stamp:
              print('machine_stale=true')
              print('last_cycle_at=')
          else:
              observed=dt.datetime.fromisoformat(stamp.replace('Z','+00:00'))
              age=max(0,int((dt.datetime.now(dt.timezone.utc)-observed).total_seconds()))
              print(f'machine_age_seconds={age}')
              print(f'machine_stale={str(age>3900).lower()}')
              print(f'last_cycle_at={stamp}')
          alerts=metrics.get("healthAlerts") or []
          critical_prefixes=(
              "t0_frontier_stalled_over_2h_without_chief_ready:",
              "owner_stale_with_backlog:",
          )
          critical=[a for a in alerts if str(a).startswith(critical_prefixes)]
          attention=[a for a in alerts if a not in critical]
          print(f'workgraph_healthy={str(bool(metrics.get("healthy"))).lower()}')
          print(f'workgraph_alert_count={len(alerts)}')
          print(f'workgraph_critical_count={len(critical)}')
          print(f'workgraph_attention_count={len(attention)}')
          print(f'workgraph_critical={str(bool(critical)).lower()}')
          PY

      - name: Check GitHub-native execution plane
        id: execution
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_CYCLE_AT: ${{ steps.freshness.outputs.last_cycle_at }}
          WORKGRAPH_HEALTHY: ${{ steps.freshness.outputs.workgraph_healthy }}
          WORKGRAPH_CRITICAL: ${{ steps.freshness.outputs.workgraph_critical }}
        run: |
          set -euo pipefail
          latest() {
            gh run list --repo "${{ github.repository }}" --workflow "$1" --branch main --limit 20 \
              --json databaseId,status,conclusion,createdAt,headSha \
              --jq '[.[] | select(.status == "completed" and .conclusion != "cancelled")][0]'
          }

          scheduler=$(latest earth2036-scheduler.yml)
          pages=$(latest earth2036-pages.yml)
          reconcile=$(latest earth2036-workgraph-reconcile.yml)
          ci=$(latest earth2036-ci.yml)

          scheduler_conclusion=$(jq -r '.conclusion // "missing"' <<<"$scheduler")
          pages_conclusion=$(jq -r '.conclusion // "missing"' <<<"$pages")
          reconcile_conclusion=$(jq -r '.conclusion // "missing"' <<<"$reconcile")
          ci_conclusion=$(jq -r '.conclusion // "missing"' <<<"$ci")
          pages_created=$(jq -r '.createdAt // ""' <<<"$pages")
          pages_head=$(jq -r '.headSha // ""' <<<"$pages")
          main_head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)

          unhealthy=false
          if [ "$scheduler_conclusion" != "success" ]; then unhealthy=true; fi
          if [ "$pages_conclusion" != "success" ]; then unhealthy=true; fi
          if [ "$reconcile_conclusion" != "missing" ] && [ "$reconcile_conclusion" != "success" ]; then unhealthy=true; fi
          if [ "$ci_conclusion" != "missing" ] && [ "$ci_conclusion" != "success" ]; then unhealthy=true; fi
          # Ordinary zero-closure warnings are productivity ATTENTION, not an execution-plane outage.
          # Fail only on routing/execution deadlock or stale ownership. A chief_ready company lawfully held by Beast is governance attention, not an execution-plane outage.
          if [ "$WORKGRAPH_CRITICAL" = "true" ]; then unhealthy=true; fi

          pages_stale=false
          if [ -n "$pages_created" ]; then
            pages_epoch=$(date -d "$pages_created" +%s)
            now_epoch=$(date -u +%s)
            if [ "$pages_head" != "$main_head" ] && [ $((now_epoch - pages_epoch)) -gt 1200 ]; then
              pages_stale=true
            fi
          elif [ -n "$LAST_CYCLE_AT" ]; then
            pages_stale=true
          fi

          # Stale-but-previously-successful Pages is recoverable when no old active
          # deployment is blocking refresh. An active Pages run older than 20 minutes
          # is itself a liveness fault; the Pages deploy job is separately time-bounded.
          if [ "$pages_stale" = "true" ]; then
            active_pages_created=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-pages.yml --limit 20 --json status,createdAt --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | sort_by(.createdAt) | .[0].createdAt // ""')
            if [ -n "$active_pages_created" ]; then
              active_pages_epoch=$(date -d "$active_pages_created" +%s)
              now_epoch=$(date -u +%s)
              if [ $((now_epoch - active_pages_epoch)) -gt 1200 ]; then
                unhealthy=true
              fi
            fi
          fi
          echo "scheduler_conclusion=$scheduler_conclusion" >> "$GITHUB_OUTPUT"
          echo "pages_conclusion=$pages_conclusion" >> "$GITHUB_OUTPUT"
          echo "reconcile_conclusion=$reconcile_conclusion" >> "$GITHUB_OUTPUT"
          echo "ci_conclusion=$ci_conclusion" >> "$GITHUB_OUTPUT"
          echo "pages_stale=$pages_stale" >> "$GITHUB_OUTPUT"
          echo "unhealthy=$unhealthy" >> "$GITHUB_OUTPUT"

      - name: Recover a missing current-hour scheduler slot when idle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE_STALE: ${{ steps.freshness.outputs.machine_stale }}
        run: |
          set -euo pipefail
          # Scheduled GitHub Actions are best-effort. A healthy last cycle is not
          # proof that a scheduler was created in the current UTC hour.
          current_hour="$(date -u +'%Y%m%dT%H00Z')"
          current_start="$(date -u +'%Y-%m-%dT%H:00:00Z')"
          minute="$(date -u +'%M')"
          minute=$((10#$minute))
          if [ "$minute" -lt 20 ] && [ "$MACHINE_STALE" != "true" ]; then
            echo "Current hour is not yet past the 20-minute recovery threshold."
            exit 0
          fi

          # Always check actual observed machine state and real GitHub scheduler
          # attempts; never infer missing observations from a dashboard timestamp.
          state="$(gh api "repos/${{ github.repository }}/contents/data/runtime/system-state.json?ref=main" --jq .content | base64 -d)"
          observed_hour="$(jq -r '.cycleKey // ""' <<<"$state")"
          if [ "$observed_hour" = "$current_hour" ]; then
            echo "A real machine observation already exists for $current_hour."
            exit 0
          fi
          scheduler_runs="$(gh run list --repo "${{ github.repository }}" --workflow earth2036-scheduler.yml --branch main --limit 60 --json createdAt,status,conclusion)"
          active="$(jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' <<<"$scheduler_runs")"
          if [ "$active" != "0" ]; then
            echo "Scheduler already queued or active; do not dispatch a duplicate."
            exit 0
          fi
          created_in_hour="$(jq -r --arg floor "$current_start" '[.[] | select(.createdAt >= $floor)] | length' <<<"$scheduler_runs")"
          if [ "$created_in_hour" != "0" ]; then
            echo "A scheduler was already attempted in $current_hour; report its outcome instead of blindly retrying."
            exit 0
          fi
          echo "Missing real observation and scheduler attempt for $current_hour; dispatching one bounded current-hour recovery."
          gh workflow run earth2036-scheduler.yml --repo "${{ github.repository }}" --ref main

      - name: Refresh stale Pages projection when idle
        if: steps.execution.outputs.pages_stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-pages.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" = "0" ]; then
            main_head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="$main_head"
          fi

      - name: Backstop missing independent hourly audit receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(date -u -d '1 hour ago' +'%Y%m%dT%H00Z')"
          day="$(date -u -d '1 hour ago' +'%Y/%m/%d')"
          receipt="data/operations/hourly-audits/$day/$target.json"

          if gh api "repos/${{ github.repository }}/contents/$receipt?ref=main" >/dev/null 2>&1; then
            echo "Hourly accountability receipt present for $target."
            exit 0
          fi

          active=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-hourly-accountability.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" = "0" ]; then
            echo "Missing hourly receipt for $target; dispatching independent accountability workflow."
            gh workflow run earth2036-hourly-accountability.yml --repo "${{ github.repository }}" --ref main
          else
            echo "Hourly accountability workflow already in progress or queued."
          fi

      - name: Fail closed on unhealthy GitHub-native plane
        if: steps.execution.outputs.unhealthy == 'true'
        run: |
          echo "Earth 2036 execution-plane unhealthy: scheduler=${{ steps.execution.outputs.scheduler_conclusion }}, pages=${{ steps.execution.outputs.pages_conclusion }}, reconcile=${{ steps.execution.outputs.reconcile_conclusion }}, ci=${{ steps.execution.outputs.ci_conclusion }}, pages_stale=${{ steps.execution.outputs.pages_stale }}, workgraph_critical=${{ steps.freshness.outputs.workgraph_critical }}, attention=${{ steps.freshness.outputs.workgraph_attention_count }}." >&2
          exit 1
