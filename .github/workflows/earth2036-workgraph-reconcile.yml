name: Earth 2036 Workgraph Reconcile

on:
  push:
    branches: [main]
    paths:
      - "data/runtime/workgraph/role-runs/**"
      - ".github/workflows/earth2036-workgraph-reconcile.yml"
      - "scripts/check-runtime-coherence.mjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: earth2036-workgraph-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reconcile Workgraph from newest evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "earth2036-workgraph[bot]"
          git config user.email "earth2036-workgraph@users.noreply.github.com"

          reconciled_head=""
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin main
            git reset --hard origin/main

            npm ci
            npm run typecheck
            node --test test/workgraph-v2.test.mjs test/operations-invariants.test.mjs

            # Phase 1: always materialize truthful non-canonical routing/projection.
            # A global Beast/source-mesh failure must never hide newly-arrived evidence
            # or leave workers looking stale. Promotion remains gated below.
            npm run workgraph:sync
            node scripts/mark-council-pending.mjs

            # Audit before promotion, but do not let a global source-mesh failure
            # suppress truthful non-canonical routing state.
            beast_status=0
            node scripts/beast-audit.mjs || beast_status=$?

            base_head=$(git rev-parse HEAD)
            git fetch --no-tags --depth=1 origin main
            remote_head=$(git rev-parse origin/main)

            if [ "$base_head" != "$remote_head" ]; then
              echo "Evidence branch advanced during reconciliation; discarding derived state and retrying from newest evidence."
              continue
            fi

            if git diff --quiet -- data/runtime/workgraph data/runtime/system-state.json data/runtime/supervisor-state.json; then
              reconciled_head="$base_head"
            else
              git add data/runtime/workgraph data/runtime/system-state.json data/runtime/supervisor-state.json
              git commit -m "Earth 2036 workgraph reconcile from evidence"
              reconciled_head=$(git rev-parse HEAD)
              if ! git push origin HEAD:main; then
                echo "Non-canonical reconciliation push raced with another writer; retrying."
                reconciled_head=""
                continue
              fi
            fi
            break
          done

          if [ -z "$reconciled_head" ]; then
            echo "Unable to persist Workgraph reconciliation after 3 attempts." >&2
            exit 1
          fi

          # Phase 2: canonical promotion is still fail-closed.
          if [ "$beast_status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin main
            git reset --hard origin/main

            node scripts/promote-chief-ready.mjs
            node scripts/mark-council-pending.mjs

            # Canonical promotion changes the authoritative population. Refresh every
            # shadow/worker projection immediately so Trajectory, Digital Twin,
            # Calibration and command views describe the same canonical state.
            npm run workgraph:sync
            npm run smoke:runtime

            # Re-audit the fully refreshed staged canonical result. Any failure
            # discards promotion while the already-pushed non-canonical routing remains.
            if ! node scripts/beast-audit.mjs; then
              echo "Post-promotion Beast audit failed; persisting non-canonical Workgraph state and routing only."
              exit 0
            fi

            canonical_projection_changed=false
            if ! git diff --quiet -- \
                data/runtime/current-ranking.json \
                data/runtime/score-state.json \
                data/runtime/causal-graph.json \
                data/baseline-evidence \
                data/baselines/earth2036-official-t0-2026-09-12/manifest.json; then
              canonical_projection_changed=true
            fi

            if git diff --quiet -- data/runtime/workgraph data/runtime/system-state.json data/runtime/supervisor-state.json data/runtime/source-health.json data/runtime/score-state.json data/runtime/current-ranking.json data/runtime/causal-graph.json data/runtime/intelligence-integrity.json data/baseline-evidence data/baselines/earth2036-official-t0-2026-09-12/manifest.json; then
              exit 0
            fi

            promotion_base=$(git rev-parse HEAD)
            git fetch --no-tags --depth=1 origin main
            promotion_remote=$(git rev-parse origin/main)
            if [ "$promotion_base" != "$promotion_remote" ]; then
              echo "Repository advanced before canonical promotion; leaving promotion for the next reconciliation/scheduler run."
              exit 0
            fi

            git add data/runtime/workgraph data/runtime/system-state.json data/runtime/supervisor-state.json data/runtime/source-health.json data/runtime/score-state.json data/runtime/current-ranking.json data/runtime/causal-graph.json data/runtime/intelligence-integrity.json data/baseline-evidence data/baselines/earth2036-official-t0-2026-09-12/manifest.json
            git commit -m "Earth 2036 gated canonical promotion from evidence"
            promotion_head=$(git rev-parse HEAD)

            if git push origin HEAD:main; then
              echo "canonical_projection_changed=$canonical_projection_changed"
              if [ "$canonical_projection_changed" = "true" ]; then
                gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="$promotion_head"
                echo "Dispatched Pages immediately for canonical projection $promotion_head."
              fi
              exit 0
            fi

            echo "Canonical promotion push raced with another writer; leaving it for the next reconciliation/scheduler run."
            exit 0
          fi

          echo "Beast/source-mesh gate remains closed; persisting non-canonical Workgraph state and routing only."
          exit 0

      - name: Recover stale source cycle and refresh browser projection
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          state_json=$(gh api "repos/${{ github.repository }}/contents/data/runtime/system-state.json?ref=main" --jq .content | tr -d '\n' | base64 -d)
          last_cycle=$(jq -r '.lastCycleAt // ""' <<<"$state_json")
          now_epoch=$(date -u +%s)
          machine_age=999999
          if [ -n "$last_cycle" ]; then
            machine_age=$((now_epoch - $(date -d "$last_cycle" +%s)))
          fi

          if [ "$machine_age" -gt 3300 ]; then
            active_scheduler=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-scheduler.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
            if [ "$active_scheduler" = "0" ]; then
              gh workflow run earth2036-scheduler.yml --repo "${{ github.repository }}" --ref main
              echo "Dispatched Scheduler because machine source state is ${machine_age}s old."
            fi
          fi

          latest_pages=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-pages.yml --branch main --limit 1 --json status,createdAt,headSha --jq '.[0] // {}')
          pages_status=$(jq -r '.status // "missing"' <<<"$latest_pages")
          pages_created=$(jq -r '.createdAt // ""' <<<"$latest_pages")
          pages_age=999999
          if [ -n "$pages_created" ]; then
            pages_age=$((now_epoch - $(date -d "$pages_created" +%s)))
          fi
          active_pages=$(gh run list --repo "${{ github.repository }}" --workflow earth2036-pages.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')

          if [ "$active_pages" = "0" ] && { [ "$pages_status" = "missing" ] || [ "$pages_age" -gt 1200 ]; }; then
            current_main=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            gh workflow run earth2036-pages.yml --repo "${{ github.repository }}" --ref main -f source_sha="$current_main"
            echo "Dispatched bounded operational Pages refresh for $current_main."
          fi
