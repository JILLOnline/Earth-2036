name: Fundamentals Truth Canary

on:
  pull_request:
    paths:
      - "config/fundamentals-truth-contract-v1.json"
      - "scripts/lib/fundamental-metric-map.mjs"
      - "scripts/lib/sec-fundamentals-truth.mjs"
      - "scripts/lab-fundamentals-truth.mjs"
      - "test/fundamentals-truth.test.mjs"
      - "package.json"
      - ".github/workflows/fundamentals-truth-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit truth invariants
        run: node --test test/fundamentals-truth.test.mjs
      - name: Live SEC Company Facts canary
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: npm run truth:fundamentals -- --tickers ETN,AAPL,ASML,TSM,NVO,ARM,AMT,COIN --limit 8 --no-write --audit-details
      - name: Historical point-in-time reconstruction canary
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: npm run truth:fundamentals -- --tickers ETN,AAPL,ASML --limit 3 --no-write --as-of 2020-12-31T23:59:59Z --audit-details
      - name: Full T0 universe raw-truth coverage audit
        env:
          SEC_USER_AGENT: "JILLOnline Earth2036 info@jillonlinestore.com"
        run: npm run truth:fundamentals -- --limit 250 --no-write --summary-only
