name: Import canonical Earth 2036 T0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-t0.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNAPSHOT_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-aff8-822f-b49f-d6754cb2f54a/raw?se=2026-09-18T20%3A21%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=77c5e2b5-269e-5ec3-9379-2fa36097bb31&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T18%3A57%3A59Z&ske=2026-09-19T18%3A57%3A59Z&sks=b&skv=2026-02-06&sig=rwEBmHQb0pS6%2B4RsjdfOnZ25PXiw8NQ/IGZFOXDoe28%3D"
      EXPECTED_SHA256: "de76fdd8250ba9e0132d3073a50341d221547055bd52c99625a8a42754c0cf6a"
      SOURCE_SHA: "ae4ac969defa625b7fbd58213ff901de9428cc2a"
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen T0 snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SNAPSHOT_URL" -o /tmp/migration.zip
          unzip -q /tmp/migration.zip -d /tmp/migration
          actual="$(sha256sum /tmp/migration/earth2036-migration.tgz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          test "$(tr -d '\r\n' < /tmp/migration/earth2036-source-sha.txt)" = "$SOURCE_SHA"
          mkdir -p /tmp/source
          tar -xzf /tmp/migration/earth2036-migration.tgz -C /tmp/source

      - name: Replace seed repo with canonical Earth 2036 tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a /tmp/source/earth-2036/ ./
          cat > MIGRATION_SOURCE.md <<EOF
          # Earth 2036 canonical migration

          Source repository: JILLOnline/Side-Projects
          Source branch: earth-2036/official-baseline-t0
          Frozen source SHA: $SOURCE_SHA
          Snapshot SHA-256: $EXPECTED_SHA256

          This repository is the successor authority for Earth 2036. The migrated T0 runtime, evidence, workgraph, methodology, and historical project files were preserved from the frozen source snapshot.
          EOF

      - name: Remove one-time importer and commit new world
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-t0.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "earth2036-migration[bot]"
          git config user.email "earth2036-migration@users.noreply.github.com"
          git add -A
          git commit -m "Earth 2036: migrate canonical T0 into dedicated repository"
          git push origin HEAD:main
