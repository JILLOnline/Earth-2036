name: Phoenix P7B SEC Archive Pilot (read only)

on:
  push:
    branches:
      - ops/phoenix-p7b-research-triage-20261017
    paths:
      - .github/workflows/phoenix-p7b-sec-archive-pilot.yml
      - scripts/phoenix-archive-pilot.mjs
      - scripts/phoenix-sec-acceptance-audit.mjs
      - scripts/phoenix-edgar-primary-pilot.mjs
      - test/phoenix-edgar-primary-pilot.test.mjs
      - scripts/phoenix-edgar-daily-index-pilot.mjs
      - test/phoenix-edgar-daily-index-pilot.test.mjs
      - scripts/phoenix-edgar-amendment-family.mjs
      - test/phoenix-edgar-amendment-family.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-p7b-archive-pilot
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download bounded historical SEC source cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p7b"
          gh release download fundamentals-cache-20261017T050818Z-39004369528 \
            --repo JILLOnline/Earth-2036 \
            --pattern bridge-cache.tar.gz --dir "$RUNNER_TEMP/p7b"
          test "$(stat -c '%s' "$RUNNER_TEMP/p7b/bridge-cache.tar.gz")" -eq 243735107
          printf '%s  %s\n' \
            6379596d013d554ca20264b5c3806bd528837934eeed492c6fff51f5705a5ae2 \
            "$RUNNER_TEMP/p7b/bridge-cache.tar.gz" | sha256sum --check
      - name: Inspect original archived company-facts bytes without authority
        run: |
          set -euo pipefail
          node scripts/phoenix-archive-pilot.mjs "$RUNNER_TEMP/p7b/bridge-cache.tar.gz" \
            > "$RUNNER_TEMP/p7b/archive-report.json"
          jq '{contract,mode,cutoff,sourceCycle,archiveBytesAuthenticated,historicalT0EvidenceAdmitted,canonicalWriteAuthority,companies:[.companies[]|{ticker,cik,archivedFullPayloadVerified,liveReferenceMatches,historicalFiledDateFilteredFacts,distinctHistoricalAccessions,acceptanceTimestampAttested,publicAvailabilityAttested,historicalEligibility}]}' \
            "$RUNNER_TEMP/p7b/archive-report.json"
      - name: Cross-check filed-date-filtered accessions with SEC submission metadata
        env:
          SEC_USER_AGENT: JILLOnline Earth2036 info@jillonlinestore.com
        run: |
          set -euo pipefail
          node scripts/phoenix-sec-acceptance-audit.mjs "$RUNNER_TEMP/p7b/archive-report.json" > "$RUNNER_TEMP/p7b/sec-acceptance-report.json"
          jq '{contract,cutoff,publicAvailabilityAuthenticated,historicalT0EvidenceAdmitted,companies:[.companies[]|{ticker,archiveCandidates,counts,allAccessionMetadataMatched}]}' "$RUNNER_TEMP/p7b/sec-acceptance-report.json"
      - name: Test bounded original EDGAR document contract
        run: |
          set -euo pipefail
          node --test test/phoenix-edgar-primary-pilot.test.mjs
      - name: Hash bounded original EDGAR documents, preserving availability holds
        env:
          SEC_USER_AGENT: JILLOnline Earth2036 info@jillonlinestore.com
        run: |
          set -euo pipefail
          node scripts/phoenix-edgar-primary-pilot.mjs "$RUNNER_TEMP/p7b/sec-acceptance-report.json" > "$RUNNER_TEMP/p7b/original-primary-report.json"
          jq '{contract,cutoff,chosenFilingCount,originalPrimaryDocumentsVerifiedNow,acceptanceHeaderMatches,publicAvailabilityAtT0Authenticated,historicalT0EvidenceAdmitted,filings:[.filings[]|{ticker,accessionNumber,form,primaryRetrievalStatus,headerAcceptanceStatus,primarySha256}]}' "$RUNNER_TEMP/p7b/original-primary-report.json"
      - name: Corroborate original filings in date-specific public EDGAR indexes
        env:
          SEC_USER_AGENT: JILLOnline Earth2036 info@jillonlinestore.com
        run: |
          set -euo pipefail
          node --test test/phoenix-edgar-daily-index-pilot.test.mjs
          node scripts/phoenix-edgar-daily-index-pilot.mjs "$RUNNER_TEMP/p7b/original-primary-report.json" > "$RUNNER_TEMP/p7b/daily-index-report.json"
          jq '{contract,cutoff,checkedFilings,matchingDatedIndexes,publicAvailabilityAtT0Authenticated,historicalT0EvidenceAdmitted,records:[.records[]|{ticker,accessionNumber,status}]}' "$RUNNER_TEMP/p7b/daily-index-report.json"
      - name: Review nine 10-K amendments with exact-report-period original documents
        env:
          SEC_USER_AGENT: JILLOnline Earth2036 info@jillonlinestore.com
        run: |
          set -euo pipefail
          node --test test/phoenix-edgar-amendment-family.test.mjs
          node scripts/phoenix-edgar-amendment-family.mjs "$RUNNER_TEMP/p7b/sec-acceptance-report.json" > "$RUNNER_TEMP/p7b/amendment-family-report.json"
          jq '{contract,totalAmendments,originalPeriodMatched,amendmentPrimaryDocumentsRetrieved,originalPrimaryDocumentsRetrieved,amendmentContentReviewComplete,historicalT0EvidenceAdmitted,families:[.families[]|{ticker,amendment:.amendment.accessionNumber,original:.original.accessionNumber,sourcePeriodMatchStatus,amendmentStatus:.amendmentDocument.status,originalStatus:.originalDocument.status,supersessionDisposition}]}' "$RUNNER_TEMP/p7b/amendment-family-report.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phoenix-p7b-sec-source-archive-readonly
          path: |
            ${{ runner.temp }}/p7b/archive-report.json
            ${{ runner.temp }}/p7b/sec-acceptance-report.json
            ${{ runner.temp }}/p7b/original-primary-report.json
            ${{ runner.temp }}/p7b/daily-index-report.json
            ${{ runner.temp }}/p7b/amendment-family-report.json
          retention-days: 3
          if-no-files-found: error
