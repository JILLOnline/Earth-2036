name: Earth 2036 Scheduler Watchdog

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: earth2036-scheduler-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check persisted machine-cycle freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contents/data/runtime/system-state.json?ref=main" > /tmp/state.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, datetime as dt, json
          p=json.load(open('/tmp/state.json'))
          state=json.loads(base64.b64decode(p['content']).decode())
          stamp=state.get('lastCycleAt')
          if not stamp:
              print('stale=true')
          else:
              observed=dt.datetime.fromisoformat(stamp.replace('Z','+00:00'))
              age=max(0,int((dt.datetime.now(dt.timezone.utc)-observed).total_seconds()))
              print(f'age_seconds={age}')
              print(f'stale={str(age>3600).lower()}')
          PY

      - name: Dispatch scheduler if stale and idle
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "${{ github.repository }}" --workflow scheduler.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" = "0" ]; then
            gh workflow run scheduler.yml --repo "${{ github.repository }}" --ref main
          fi
